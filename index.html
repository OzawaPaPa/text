<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>答题练习</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100vh;padding:24px 16px 60px;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;color:#2d3748;background:linear-gradient(160deg,#eef2ff 0%,#f8fafc 45%,#fdf2f8 100%);background-attachment:fixed}
.app{max-width:780px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
header h1{font-size:20px;margin:0;letter-spacing:.5px}
.toolbar{display:flex;gap:8px;flex-wrap:wrap}
button{font:inherit;font-size:14px;cursor:pointer;border:1px solid transparent;border-radius:10px;padding:9px 14px;background:#fff;color:#2d3748;box-shadow:0 1px 3px rgba(16,24,40,.08);transition:all .18s ease}
button:hover:not(:disabled){box-shadow:0 6px 16px rgba(16,24,40,.12);transform:translateY(-1px)}
button:active:not(:disabled){transform:translateY(0)}
button:disabled{opacity:.45;cursor:not-allowed}
button.active{background:#eef2ff;border-color:#c7d2fe;color:#4f46e5}
button.primary{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:99px;background:#ef4444;color:#fff;font-size:11px;line-height:18px;text-align:center}
.progress{height:8px;background:#e7ebf5;border-radius:99px;overflow:hidden}
.progress>div{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#667eea,#a855f7);transition:width .35s ease}
.meta{display:flex;justify-content:space-between;font-size:13px;color:#8a94a6;margin:10px 4px 14px}
.card{background:#fff;border-radius:18px;padding:26px;box-shadow:0 12px 32px rgba(31,41,55,.08)}
.question{font-size:17px;font-weight:600;line-height:1.7;margin-bottom:20px;white-space:pre-wrap;word-break:break-word}
.question .tag{
  display:inline-block;
  font-size:13px;
  font-weight:normal;
  padding:2px 6px;
  border-radius:6px;
  margin-right:8px;
}
.tag-single{
  background:#eef2ff;
  color:#4f46e5;
}
.tag-multi{
  background:#fef2f2;
  color:#b91c1c;
}
.options{display:flex;flex-direction:column;gap:10px}
.option{display:flex;gap:12px;align-items:flex-start;padding:13px 15px;border:2px solid #e5e9f2;border-radius:12px;background:#fff;cursor:pointer;line-height:1.6;font-size:15px;transition:all .15s ease;user-select:none;word-break:break-word}
.option:not(.disabled):hover{border-color:#c7d2fe;background:#f8faff}
.option .label{flex:0 0 26px;width:26px;height:26px;border-radius:50%;background:#eef1fb;color:#5b6ef5;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;transition:all .15s ease}
.option.selected{border-color:#667eea;background:#eef2ff}
.option.selected .label{background:#667eea;color:#fff}
.option.correct{border-color:#22c55e;background:#f0fdf4}
.option.correct .label{background:#22c55e;color:#fff}
.option.wrong{border-color:#ef4444;background:#fef2f2}
.option.wrong .label{background:#ef4444;color:#fff}
.option.disabled{cursor:default}
.feedback{margin-top:16px;padding:13px 15px;border-radius:12px;font-size:14px;line-height:1.7;display:none;white-space:pre-wrap}
.feedback.show{display:block}
.feedback.ok{background:#f0fdf4;color:#15803d;border:1px solid #bbf7d0}
.feedback.no{background:#fef2f2;color:#b91c1c;border:1px solid #fecaca}
.actions{display:flex;gap:10px;margin-top:22px}
.actions button{flex:1;padding:13px;font-size:15px;font-weight:600;border-radius:12px}
.hidden{display:none!important}
.result{text-align:center;padding:40px 26px}
.res-emoji{font-size:56px;line-height:1}
.res-title{font-size:22px;font-weight:700;margin-top:14px}
.res-score{font-size:46px;font-weight:800;margin:12px 0 4px;background:linear-gradient(135deg,#667eea,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent}
.res-score span{font-size:20px;-webkit-text-fill-color:#b0b7c6}
.res-rate{color:#8a94a6;font-size:14px}
.result .actions{max-width:420px;margin:26px auto 0}
.panel{position:fixed;inset:0;z-index:100;padding:20px;background:rgba(17,24,39,.45);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center}
.panel-inner{background:#fff;border-radius:18px;width:100%;max-width:720px;max-height:86vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 24px 60px rgba(0,0,0,.28)}
.panel-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px;border-bottom:1px solid #eef1f6}
.panel-head h2{margin:0;font-size:17px}
button.close{padding:6px 12px;border-radius:8px;background:#f3f4f8;box-shadow:none}
.wrong-list{flex:1;overflow-y:auto;padding:16px 20px}
.wrong-item{padding:12px 14px;border-radius:12px;background:#f8fafc;margin-bottom:10px;border:1px solid #eef1f6}
.wrong-item .wq{font-weight:600;font-size:14.5px;line-height:1.65;margin-bottom:6px;white-space:pre-wrap}
.wrong-item .tag{
  display:inline-block;
  font-size:12px;
  padding:1px 5px;
  border-radius:5px;
  margin-right:6px;
}
.empty{text-align:center;color:#9aa3b2;padding:40px 0;font-size:14px}
.panel-foot{display:flex;gap:10px;padding:14px 20px;border-top:1px solid #eef1f6}
.panel-foot button{flex:1;padding:12px;font-weight:600}
.toast{position:fixed;left:50%;bottom:40px;transform:translate(-50%,20px);background:rgba(30,41,59,.92);color:#fff;padding:10px 20px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:all .25s ease;z-index:200}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media(max-width:520px){body{padding:14px 12px 40px}.card{padding:20px 16px}.question{font-size:16px}.option{font-size:14.5px}}
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>📝 答题练习</h1>
    <div class="toolbar">
      <button id="btnShuffleQ" class="active">🔀 打乱题目：开</button>
      <button id="btnShuffleO">🎲 选项乱序：关</button>
      <button id="btnWrong">📕 错题本 <span class="badge" id="wrongCount">0</span></button>
    </div>
  </header>

  <div class="progress"><div id="bar"></div></div>
  <div class="meta"><span id="qnum"></span><span id="scoreText"></span></div>

  <main id="card" class="card">
    <div class="question" id="question"></div>
    <div class="options" id="options"></div>
    <div class="feedback" id="feedback"></div>
    <div class="actions">
      <button id="btnSubmit" class="primary">提交答案</button>
      <button id="btnNext" class="primary hidden">下一题 →</button>
    </div>
  </main>

  <div id="result" class="card result hidden"></div>
</div>

<div id="wrongPanel" class="panel hidden">
  <div class="panel-inner">
    <div class="panel-head">
      <h2>📕 错题本</h2>
      <button class="close" id="closeWrong">✕</button>
    </div>
    <div class="wrong-list" id="wrongList"></div>
    <div class="panel-foot">
      <button class="primary" id="practiceWrong">开始练习错题</button>
      <button id="clearWrong">清空错题本</button>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
(function () {
  'use strict';

  }
  function loadWrong() {
    try { const r = localStorage.getItem(LS_KEY); return r ? new Set(JSON.parse(r)) : new Set(); }
    catch (e) { return new Set(); }
  }
  function saveWrong() {
    try { localStorage.setItem(LS_KEY, JSON.stringify(Array.from(state.wrong))); } catch (e) {}
  }
  let toastTimer = null;
  function toast(msg) {
    const el = $('toast'); el.textContent = msg; el.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.classList.remove('show'); }, 1800);
  }
  function updateWrongCount() { $('wrongCount').textContent = state.wrong.size; }
  function updateProgress() {
    const total = state.order.length;
    const done = state.pos + (state.answered ? 1 : 0);
    $('bar').style.width = (total ? (done / total) * 100 : 0) + '%';
    $('scoreText').textContent = '答对 ' + state.correctCount + ' / 已答 ' + state.answeredCount;
  }

  function startQuiz(mode) {
    state.mode = mode;
    let pool = DATA.map(function (_, i) { return i; });
    if (mode === 'wrong') {
      pool = pool.filter(function (i) { return state.wrong.has(DATA[i].q); });
      if (!pool.length) { toast('错题本是空的，先正常练习吧～'); return; }
    }
    if (state.shuffleQ) pool = shuffleArr(pool);
    state.order = pool;
    state.optionOrders = pool.map(function (qi) {
      const n = DATA[qi].options.length;
      const arr = [];
      for (let k = 0; k < n; k++) arr.push(k);
      return state.shuffleO ? shuffleArr(arr) : arr;
    });
    state.pos = 0; state.correctCount = 0; state.answeredCount = 0;
    $('wrongPanel').classList.add('hidden');
    render();
  }

  function render() {
    const total = state.order.length;
    if (state.pos >= total) { showResult(); return; }

    $('card').classList.remove('hidden');
    $('result').classList.add('hidden');

    const qi = state.order[state.pos];
    const q = DATA[qi];
    const perm = state.optionOrders[state.pos];
    const tagHtml = q.answer.length > 1
        ? '<span class="tag tag-multi">【多选】</span>'
        : '<span class="tag tag-single">【单选】</span>';

    state.selected = []; state.answered = false;
    $('qnum').textContent = '第 ' + (state.pos + 1) + ' / ' + total + ' 题';
    $('question').innerHTML = tagHtml + q.q;
    $('feedback').className = 'feedback';
    $('feedback').textContent = '';
    $('btnSubmit').classList.remove('hidden');
    $('btnSubmit').disabled = false;
    $('btnNext').classList.add('hidden');

    const box = $('options');
    box.innerHTML = '';
    perm.forEach(function (origIdx, displayIdx) {
      const div = document.createElement('div');
      div.className = 'option';
      div.dataset.orig = origIdx;
      const lab = document.createElement('span');
      lab.className = 'label';
      lab.textContent = String.fromCharCode(65 + displayIdx);
      const txt = document.createElement('span');
      txt.textContent = q.options[origIdx];
      div.appendChild(lab); div.appendChild(txt);
      div.addEventListener('click', function () { onSelect(origIdx); });
      box.appendChild(div);
    });
    updateProgress();
  }

  function onSelect(origIdx) {
    if (state.answered) return;
    const q = DATA[state.order[state.pos]];
    if (q.answer.length > 1) {
      const i = state.selected.indexOf(origIdx);
      if (i >= 0) state.selected.splice(i, 1); else state.selected.push(origIdx);
    } else {
      state.selected = [origIdx];
    }
    document.querySelectorAll('#options .option').forEach(function (el) {
      el.classList.toggle('selected', state.selected.indexOf(Number(el.dataset.orig)) >= 0);
    });
  }

  function submit() {
    if (state.answered) return;
    const q = DATA[state.order[state.pos]];
    if (!state.selected.length) { toast('请先选择答案'); return; }

    state.answered = true; state.answeredCount++;
    const ok = sameSet(state.selected, q.answer);
    if (ok) { state.correctCount++; state.wrong.delete(q.q); }
    else { state.wrong.add(q.q); }
    saveWrong(); updateWrongCount();

    const perm = state.optionOrders[state.pos];
    document.querySelectorAll('#options .option').forEach(function (el) {
      const orig = Number(el.dataset.orig);
      el.classList.add('disabled');
      el.classList.remove('selected');
      if (q.answer.indexOf(orig) >= 0) el.classList.add('correct');
      else if (state.selected.indexOf(orig) >= 0) el.classList.add('wrong');
    });

    const letters = q.answer.slice().sort(function (a, b) { return a - b; })
      .map(function (i) { return String.fromCharCode(65 + perm.indexOf(i)); }).join('、');

    const fb = $('feedback');
    fb.className = 'feedback show ' + (ok ? 'ok' : 'no');
    fb.textContent = ok ? '✅ 回答正确！'
      : '❌ 回答错误，正确答案：' + letters + '\n' + q.answer.map(function (i) { return q.options[i]; }).join('  /  ');

    $('btnSubmit').classList.add('hidden');
    const nextBtn = $('btnNext');
    nextBtn.classList.remove('hidden');
    nextBtn.textContent = (state.pos === state.order.length - 1) ? '查看成绩 →' : '下一题 →';
    updateProgress();
  }

  function next() {
    if (!state.answered) return;
    state.pos++; render();
  }

  function showResult() {
    $('card').classList.add('hidden');
    $('bar').style.width = '100%';
    const total = state.answeredCount;
    const rate = total ? Math.round(state.correctCount / total * 100) : 0;
    let emoji = '🎉', title = '全部完成，太棒了！';
    if (rate < 60) { emoji = '💪'; title = '继续加油！'; }
    else if (rate < 85) { emoji = '👍'; title = '不错哦，再加把劲！'; }

    const r = $('result');
    r.classList.remove('hidden');
    r.innerHTML = '<div class="res-emoji">' + emoji + '</div>'
      + '<div class="res-title">' + title + '</div>'
      + '<div class="res-score">' + state.correctCount + ' <span>/ ' + total + '</span></div>'
      + '<div class="res-rate">正确率 ' + rate + '%　·　错题本共 ' + state.wrong.size + ' 道</div>'
      + '<div class="actions">'
      + '<button class="primary" id="againBtn">再来一轮</button>'
      + '<button id="wrongBtn2">查看错题本</button></div>';
    $('againBtn').onclick = function () { startQuiz('all'); };
    $('wrongBtn2').onclick = openWrongPanel;
  }

  function openWrongPanel() {
    const list = $('wrongList');
    list.innerHTML = '';
    const items = DATA.filter(function (q) { return state.wrong.has(q.q); });
    if (!items.length) {
      list.innerHTML = '<p class="empty">还没有错题，继续保持！</p>';
    } else {
      items.forEach(function (q, i) {
        const div = document.createElement('div');
        div.className = 'wrong-item';
        const wq = document.createElement('div');
        wq.className = 'wq';
        const tag = q.answer.length > 1
            ? '<span class="tag tag-multi">【多选】</span>'
            : '<span class="tag tag-single">【单选】</span>';
        wq.innerHTML = (i + 1) + '. ' + tag + q.q;
        const wa = document.createElement('div');
        wa.className = 'wa';
        wa.textContent = '答案：' + q.answer.slice().sort(function (a, b) { return a - b; })
          .map(function (k) { return String.fromCharCode(65 + k) + '. ' + q.options[k]; }).join('　');
        div.appendChild(wq); div.appendChild(wa);
        list.appendChild(div);
      });
    }
    $('practiceWrong').disabled = !items.length;
    $('wrongPanel').classList.remove('hidden');
  }

  function bind() {
    $('btnSubmit').onclick = submit;
    $('btnNext').onclick = next;
    $('btnShuffleQ').onclick = function () {
      state.shuffleQ = !state.shuffleQ;
      this.textContent = '🔀 打乱题目：' + (state.shuffleQ ? '开' : '关');
      this.classList.toggle('active', state.shuffleQ);
      startQuiz(state.mode);
    };
    $('btnShuffleO').onclick = function () {
      state.shuffleO = !state.shuffleO;
      this.textContent = '🎲 选项乱序：' + (state.shuffleO ? '开' : '关');
      this.classList.toggle('active', state.shuffleO);
      startQuiz(state.mode);
    };
    $('btnWrong').onclick = openWrongPanel;
    $('closeWrong').onclick = function () { $('wrongPanel').classList.add('hidden'); };
    $('wrongPanel').onclick = function (e) { if (e.target === this) this.classList.add('hidden'); };
    $('practiceWrong').onclick = function () { startQuiz('wrong'); };
    $('clearWrong').onclick = function () {
      state.wrong.clear(); saveWrong(); updateWrongCount();
      openWrongPanel(); toast('错题本已清空');
    };
    document.addEventListener('keydown', function (e) {
      if (!$('wrongPanel').classList.contains('hidden')) return;
      if (state.pos >= state.order.length) return;
      const k = e.key.toUpperCase();
      if (/^[A-H]$/.test(k) && !state.answered) {
        const perm = state.optionOrders[state.pos];
        const di = k.charCodeAt(0) - 65;
        if (di < perm.length) onSelect(perm[di]);
        e.preventDefault();
      } else if (e.key === 'Enter') {
        if (!state.answered) submit(); else next();
        e.preventDefault();
      }
    });
  }

  state.wrong = loadWrong();
  updateWrongCount();
  bind();
  if (!DATA.length) {
    $('question').textContent = '题库为空，请检查 text.xlsx。';
    $('btnSubmit').disabled = true;
  } else {
    startQuiz('all');
  }
})();
</script>
</body>
</html>
